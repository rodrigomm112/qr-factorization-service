# One app directory per build: `gcloud builds submit apps/<app> --config deploy/gcp/cloudbuild.yaml`.
# The Dockerfile's VERSION build arg stamps the git SHA into both APIs' /health/live.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --platform=linux/amd64
      - --build-arg
      - VERSION=${_VERSION}
      - -t
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
substitutions:
  _IMAGE: ''
  _VERSION: dev
