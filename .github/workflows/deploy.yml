# ---- Deploy to Cloud Run ----------------------------------------------------
# Runs scripts/deploy-gcp.sh, the same script a human runs locally: one deployment
# procedure to keep working. Auth is Workload Identity Federation, so no service-account
# JSON key exists; the OIDC exchange also leaves ADC in place for Terraform.
#
# Required repository/environment secrets:
#   GCP_WORKLOAD_IDENTITY_PROVIDER  projects/<num>/.../workloadIdentityPools/<pool>/providers/<p>
#   GCP_SERVICE_ACCOUNT             deployer SA (run.admin, artifactregistry.admin,
#     secretmanager.admin, iam.serviceAccountUser, serviceusage.serviceUsageAdmin)
#   GCP_PROJECT_ID                  target project (billing enabled)
#   JWT_SECRET                      HS256 key, >= 32 bytes
#   AUTH_CLIENT_SECRET_SHA256       SHA-256 (hex) of the demo client secret
#   AUTH_CLIENT_SECRET              optional plaintext; enables the public smoke test
name: Deploy (Cloud Run)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default: short SHA of this commit)'
        required: false
        type: string
      skip_e2e:
        description: 'Skip the smoke test against the public URLs'
        required: false
        default: false
        type: boolean
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write # only here: mints the OIDC token WIF consumes

concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false # never interrupt an apply half way

jobs:
  deploy:
    name: Build, push and apply
    runs-on: ubuntu-latest
    # Manual runs always proceed. Automatic ones only for a green CI from a push to main
    # on this repository: a fork must never reach production.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    environment:
      name: production
      url: ${{ steps.urls.outputs.web_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false

      # deploy-gcp.sh reads secrets from .env, as on a developer machine; the file lives
      # only in the runner's workspace and is deleted by the last step.
      - name: Materialise .env from secrets
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          AUTH_CLIENT_SECRET_SHA256: ${{ secrets.AUTH_CLIENT_SECRET_SHA256 }}
        run: |
          cp .env.example .env
          chmod 600 .env
          python3 - <<'PY'
          import os, pathlib, re
          env = pathlib.Path('.env')
          text = env.read_text()
          for key in ('JWT_SECRET', 'AUTH_CLIENT_SECRET_SHA256'):
              value = os.environ[key]
              if not value:
                  raise SystemExit(f'missing secret: {key}')
              text = re.sub(rf'^{key}=.*$', f'{key}={value}', text, flags=re.M)
          env.write_text(text)
          PY

      # Inputs reach the shell through env:, never as a ${{ }} expansion inside run: —
      # that is a script-injection vector even when only collaborators can dispatch.
      - name: Deploy
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
          SKIP_E2E_INPUT: ${{ inputs.skip_e2e }}
          E2E_CLIENT_ID: demo-client
          E2E_CLIENT_SECRET: ${{ secrets.AUTH_CLIENT_SECRET }}
        run: |
          # The deployer SA holds no billing.viewer; a human checks billing before deploy 1.
          args=(apply --yes --skip-billing-check)
          if [ -n "${IMAGE_TAG_INPUT}" ]; then
            args+=(--tag "${IMAGE_TAG_INPUT}")
          fi
          if [ "${SKIP_E2E_INPUT}" = "true" ] || [ -z "${E2E_CLIENT_SECRET}" ]; then
            echo "note: running without the public smoke test (no plaintext client secret available)"
            args+=(--skip-e2e)
          fi
          ./scripts/deploy-gcp.sh "${args[@]}"

      - name: Publish the deployed URLs
        id: urls
        run: |
          {
            echo "qr_api_url=$(terraform -chdir=deploy/gcp output -raw qr_api_url)"
            echo "stats_api_url=$(terraform -chdir=deploy/gcp output -raw stats_api_url)"
            echo "web_url=$(terraform -chdir=deploy/gcp output -raw web_url)"
          } >> "${GITHUB_OUTPUT}"

      - name: Health check the public URLs
        env:
          QR_API_URL: ${{ steps.urls.outputs.qr_api_url }}
          STATS_API_URL: ${{ steps.urls.outputs.stats_api_url }}
          WEB_URL: ${{ steps.urls.outputs.web_url }}
        run: |
          for url in "${QR_API_URL}" "${STATS_API_URL}"; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "${url}/health/ready")"
            echo "${url}/health/ready -> ${code}"
            [ "${code}" = "200" ] || exit 1
          done
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "${WEB_URL}/")"
          echo "web -> ${code}"
          [ "${code}" = "200" ]

      - name: Summary
        if: always()
        env:
          QR_API_URL: ${{ steps.urls.outputs.qr_api_url }}
          STATS_API_URL: ${{ steps.urls.outputs.stats_api_url }}
          WEB_URL: ${{ steps.urls.outputs.web_url }}
        run: |
          {
            echo "## Cloud Run"
            echo "- web: ${WEB_URL}"
            echo "- qr-api: ${QR_API_URL}"
            echo "- stats-api: ${STATS_API_URL}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove the materialised secrets
        if: always()
        run: rm -f .env .env.demo-credentials
